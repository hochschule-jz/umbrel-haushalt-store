version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1 and the port the server listens on inside the container
      APP_HOST: haushalt-einkaufsliste_web_1
      APP_PORT: 8080
      # The app has its own sign-in and is opened from phones and by the Siri shortcut,
      # so Umbrel's own login is not put in front of it.
      PROXY_AUTH_ADD: "false"

  web:
    # Set by release.sh: the pushed image, pinned by digest.
    image: ghcr.io/hochschule-jz/einkaufsliste:0.1.5@sha256:604d904b16cb3735f851448511ad49fad61e00099f2a7c8d2fb1b4b31af3b5f8
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      # database and photos
      - ${APP_DATA_DIR}/data:/data
